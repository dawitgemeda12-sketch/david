# Development docker-compose: backend + Postgres.
# Real secrets are supplied via a local `.env` file (see .env.example),
# never committed. Production deployments should use a managed
# Postgres instance and a secret manager instead of this compose file.
version: '3.9'

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stylish_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylish_app_dev_pw}
      POSTGRES_DB: stylish_dev
    ports:
      - '5432:5432'
    volumes:
      - stylish_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stylish_app -d stylish_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://stylish_app:${POSTGRES_PASSWORD:-stylish_app_dev_pw}@postgres:5432/stylish_dev?schema=public
    ports:
      - '3000:3000'
    volumes:
      - stylish_uploads:/app/uploads

volumes:
  stylish_pgdata:
  stylish_uploads:
